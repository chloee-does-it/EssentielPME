# Static-only preview: USD 3/month when the team's three free app slots are used.
# No database, functions, production secrets or custom domain at this stage.
name: essentielpme-staging
region: tor
static_sites:
  - name: essentielpme-preview
    github:
      repo: chloee-does-it/EssentielPME
      branch: staging
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm run build:staging
    output_dir: _staging
    index_document: index.html
    routes:
      - path: /
