# Last verified static-only topology, retained for recovery.
alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: essentielpme-preview
    match:
      authority:
        exact: ""
      path:
        prefix: /
name: essentielpme-staging
region: tor
static_sites:
- build_command: npm run build:staging
  environment_slug: node-js
  github:
    branch: staging
    deploy_on_push: true
    repo: chloee-does-it/EssentielPME
  name: essentielpme-preview
  output_dir: _staging
  source_dir: /
