document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"fr\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>À propos : trois compagnies, une bannière | Retail Logistics Canada<\u002Ftitle>\n<meta name=\"description\" content=\"Retail Logistics Canada, Integrated Freight Networks et Integrated Transportation Solutions : une seule bannière logistique au service du Canada et des É.-U. depuis 2003.\">\n<link rel=\"alternate\" hreflang=\"en-CA\" href=\"https://retaillogistics.ca/about.html\">\n<link rel=\"alternate\" hreflang=\"fr-CA\" href=\"https://retaillogistics.ca/fr/about.html\">\n<link rel=\"alternate\" hreflang=\"x-default\" href=\"https://retaillogistics.ca/about.html\">\n<link rel=\"canonical\" href=\"https://retaillogistics.ca/fr/about.html\">\n<style>\n/* ============================================================\n   Retail Logistics Canada: shared design system\n   Extracted from the approved homepage mockup (index.html).\n   Accent #C8102E · Dark #1D2733 · Grey bg #F4F6F8\n   ============================================================ */\n:root {\n  --accent: #C8102E;\n  --dark: #1d2733;\n  --ink: #1d2733;\n  --muted: #444f5b;\n  --muted-2: #5d6873;\n  --grey-bg: #f4f6f8;\n  --line: #e3e7eb;\n  --tag: #8a94a0;\n}\n\n* { margin: 0; padding: 0; box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nbody {\n  font-family: Helvetica, Arial, sans-serif;\n  color: var(--ink);\n  font-size: 17px;\n  line-height: 1.5;\n  background: #fff;\n}\nimg { max-width: 100%; display: block; }\na { color: inherit; text-decoration: none; }\n.wrap { max-width: 1280px; margin: 0 auto; }\n\n/* ---- shared bits ---- */\n.btn {\n  display: inline-block;\n  padding: 16px 34px;\n  border-radius: 4px;\n  font-weight: bold;\n  font-size: 17px;\n  cursor: pointer;\n  border: none;\n}\n.btn-primary { background: var(--accent); color: #fff; }\n.btn-primary:hover { background: #a50d26; }\n.btn-ghost { border: 2px solid var(--dark); color: var(--dark); padding: 14px 32px; }\n.btn-ghost:hover { background: var(--dark); color: #fff; }\n\n.tag {\n  display: inline-block;\n  font-size: 12px;\n  letter-spacing: 1.2px;\n  text-transform: uppercase;\n  color: var(--tag);\n  font-weight: bold;\n}\n\n.ph {\n  background: #e6eaee;\n  border: 1px dashed #b3bcc6;\n  color: #7d8794;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 13px;\n  font-style: italic;\n  text-align: center;\n  padding: 10px;\n}\n\nh2 { font-size: 34px; line-height: 1.2; }\n.section-pad { padding: 65px 90px; }\n\n/* ---- header ---- */\nheader {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 26px 90px;\n  border-bottom: 1px solid var(--line);\n  position: sticky;\n  top: 0;\n  background: #fff;\n  z-index: 60;\n}\n.logo-box { width: 220px; height: 52px; }\n.logo-img { width: auto; height: 48px; max-width: 240px; object-fit: contain; display: block; }\nnav { display: flex; align-items: center; gap: 34px; font-size: 16px; font-weight: bold; }\nnav > a:hover, nav .has-sub > a:hover { color: var(--accent); }\nnav .cta { background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 4px; }\nnav .cta:hover { background: #a50d26; color: #fff; }\nnav .lang { color: var(--tag); font-weight: normal; }\n\n/* services dropdown */\nnav .has-sub { position: relative; }\nnav .sub {\n  display: none;\n  position: absolute;\n  top: 100%;\n  left: -18px;\n  background: #fff;\n  border: 1px solid var(--line);\n  border-radius: 0 0 6px 6px;\n  box-shadow: 0 8px 22px rgba(0,0,0,.10);\n  min-width: 300px;\n  padding: 10px 0;\n  z-index: 70;\n}\nnav .has-sub:hover .sub, nav .has-sub:focus-within .sub { display: block; }\nnav .sub a { display: block; padding: 10px 20px; font-size: 15px; font-weight: normal; }\nnav .sub a:hover { background: var(--grey-bg); color: var(--accent); }\nnav .sub .grp {\n  font-size: 10px; letter-spacing: 1px; text-transform: uppercase;\n  color: var(--tag); font-weight: bold; padding: 10px 20px 4px 20px;\n}\n\n.nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 8px; }\n.nav-toggle span { display: block; width: 26px; height: 3px; background: var(--dark); margin: 5px 0; border-radius: 2px; }\n\n/* ---- page hero (interior pages) ---- */\n.page-hero { display: flex; gap: 60px; padding: 65px 90px 55px 90px; align-items: center; }\n.page-hero .hero-text { flex: 1 1 580px; max-width: 620px; }\nh1 { font-size: 46px; line-height: 1.12; margin: 0 0 20px 0; }\n.hero-sub { font-size: 20px; color: var(--muted); margin-bottom: 30px; }\n.hero-ctas { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }\n.hero-proof { font-size: 15px; color: var(--muted-2); }\n.page-hero .hero-img { flex: 0 0 460px; width: 460px; height: 320px; object-fit: cover; border-radius: 6px; }\n\n/* home hero keeps larger H1 */\n.hero { display: flex; gap: 60px; padding: 75px 90px 65px 90px; align-items: center; }\n.hero .hero-text { flex: 1 1 580px; max-width: 580px; }\n.hero h1 { font-size: 52px; }\n.hero-img { flex: 0 0 460px; width: 460px; height: 340px; object-fit: cover; border-radius: 6px; }\n\n/* ---- badges ---- */\n.badge {\n  display: inline-block;\n  font-size: 13px;\n  font-weight: bold;\n  letter-spacing: 1px;\n  text-transform: uppercase;\n  padding: 6px 14px;\n  border-radius: 4px;\n  margin-bottom: 16px;\n}\n.badge-rlc { background: #FBEAF0; color: #72243E; }\n.badge-ifn { background: #E6F1FB; color: #0C447C; }\n.badge-its { background: #E1F5EE; color: #085041; }\n\n/* ---- division bands (home) ---- */\n.bands-intro { padding: 55px 90px 10px 90px; }\n.band { display: flex; gap: 70px; align-items: center; padding: 55px 90px; }\n.band.alt { background: var(--grey-bg); }\n.band-text { flex: 1 1 600px; max-width: 600px; }\n.band-img { flex: 0 0 430px; width: 430px; height: 230px; object-fit: cover; border-radius: 6px; }\n.band h3 { font-size: 30px; margin-bottom: 12px; }\n.band p { font-size: 17px; color: var(--muted); margin-bottom: 16px; }\n.band a.band-link { color: var(--accent); font-weight: bold; font-size: 17px; }\n.band a.band-link:hover { text-decoration: underline; }\n\n/* ---- services / card grids ---- */\n.services { padding: 65px 90px 55px 90px; }\n.svc-row { display: flex; gap: 18px; margin-top: 32px; flex-wrap: wrap; }\n.svc { border: 1px solid #d8dde3; border-radius: 4px; padding: 20px 18px; flex: 1 1 205px; }\n.svc .nm { font-weight: bold; font-size: 16px; line-height: 1.3; display: block; margin-bottom: 10px; }\n.svc .dvb {\n  display: inline-block;\n  font-size: 10px;\n  font-weight: bold;\n  letter-spacing: 0.6px;\n  text-transform: uppercase;\n  padding: 3px 8px;\n  border-radius: 3px;\n}\n.svc p { font-size: 15px; color: var(--muted); margin-top: 8px; }\n.svc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 32px; }\n.svc-grid .svc { flex: none; }\n.svc-grid-2 { grid-template-columns: repeat(2, 1fr); }\n\n/* ---- checklist ---- */\n.checklist { columns: 2; column-gap: 50px; margin-top: 28px; }\n.checklist li {\n  list-style: none;\n  break-inside: avoid;\n  padding: 10px 0 10px 34px;\n  position: relative;\n  font-size: 17px;\n  color: var(--muted);\n}\n.checklist li::before {\n  content: \"✓\";\n  position: absolute;\n  left: 0; top: 8px;\n  width: 22px; height: 22px;\n  border-radius: 12px;\n  background: var(--accent);\n  color: #fff;\n  font-size: 13px;\n  font-weight: bold;\n  display: flex; align-items: center; justify-content: center;\n}\n\n/* ---- dark section (why / certifications) ---- */\n.why { padding: 65px 90px; background: var(--dark); color: #fff; }\n.why h2 { color: #fff; }\n.why-grid { display: flex; gap: 30px; margin-top: 40px; flex-wrap: wrap; }\n.why-item { flex: 1 1 250px; }\n.why-item .big { font-size: 21px; font-weight: bold; display: block; margin-bottom: 8px; }\n.why-item p { font-size: 15px; color: #c4ccd4; }\n\n/* ---- testimonial ---- */\n.testi { padding: 65px 90px; }\n.testi blockquote { font-size: 25px; line-height: 1.45; max-width: 880px; }\n.testi .who { margin-top: 18px; font-size: 16px; color: var(--muted-2); font-weight: bold; }\n\n/* ---- steps ---- */\n.steps { background: var(--grey-bg); padding: 65px 90px; }\n.steps-grid { display: flex; gap: 28px; margin-top: 36px; flex-wrap: wrap; }\n.step { flex: 1 1 300px; }\n.step .num {\n  width: 44px; height: 44px; border-radius: 22px;\n  background: var(--accent); color: #fff; font-weight: bold; font-size: 20px;\n  display: flex; align-items: center; justify-content: center; margin-bottom: 14px;\n}\n.step h3 { font-size: 21px; margin-bottom: 8px; }\n.step p { font-size: 16px; color: var(--muted); }\n\n/* ---- final CTA ---- */\n.final { padding: 75px 90px; text-align: center; }\n.final h2 { font-size: 40px; }\n.final p { font-size: 18px; color: var(--muted-2); margin: 14px 0 30px 0; }\n\n/* ---- generic content section ---- */\n.content-sec { padding: 65px 90px; }\n.content-sec.alt { background: var(--grey-bg); }\n.content-sec h2 { margin-top: 6px; }\n.content-sec .lead { font-size: 18px; color: var(--muted); max-width: 760px; margin-top: 14px; }\n#story .lead { max-width: none; }\n\n/* ---- pending-content placeholder (client to provide) ---- */\n.pending {\n  border: 1px dashed #b3bcc6;\n  background: #fbfcfd;\n  border-radius: 6px;\n  padding: 22px 26px;\n  margin-top: 28px;\n  color: #7d8794;\n  font-style: italic;\n  font-size: 15px;\n}\n\n/* ---- tool cards ---- */\n.tool-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; margin-top: 36px; }\n.tool-card {\n  border: 1px solid #d8dde3;\n  border-radius: 6px;\n  padding: 28px;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n.tool-card .tic {\n  width: 44px; height: 44px;\n  border: 2px solid var(--dark); border-radius: 8px;\n  font-size: 20px; font-weight: bold;\n  display: flex; align-items: center; justify-content: center;\n  margin-bottom: 6px;\n}\n.tool-card h3 { font-size: 22px; }\n.tool-card p { font-size: 16px; color: var(--muted); flex: 1; }\n.tool-card .btn { align-self: flex-start; padding: 12px 26px; font-size: 16px; }\n.tool-card form { display: flex; gap: 8px; margin-top: 4px; }\n.tool-card input {\n  flex: 1 1 auto; min-width: 0;\n  border: 1px solid #d8dde3; border-radius: 4px;\n  padding: 10px 12px; font-size: 15px;\n}\n\n/* ---- quote form ---- */\n.quote-form { margin-top: 36px; max-width: 860px; }\n.quote-form fieldset { border: none; margin-bottom: 34px; }\n.quote-form legend {\n  font-size: 21px; font-weight: bold; margin-bottom: 18px;\n  padding-top: 8px;\n}\n.form-row { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }\n.form-field { flex: 1 1 240px; display: flex; flex-direction: column; gap: 6px; }\n.form-field.full { flex-basis: 100%; }\n.form-field label { font-size: 14px; font-weight: bold; }\n.form-field input, .form-field select, .form-field textarea {\n  border: 1px solid #c9d0d7; border-radius: 4px;\n  padding: 12px 12px; font-size: 16px; font-family: inherit;\n  background: #fff;\n}\n.form-field textarea { min-height: 120px; resize: vertical; }\n.form-checks { display: flex; gap: 10px 26px; flex-wrap: wrap; margin-bottom: 6px; }\n.form-checks label {\n  display: flex; align-items: center; gap: 8px;\n  font-size: 15px; color: var(--muted); font-weight: normal;\n}\n.form-note { font-size: 14px; color: var(--muted-2); margin-top: 10px; }\n\n/* ---- contact layout ---- */\n.contact-cols { display: flex; gap: 70px; padding: 65px 90px; flex-wrap: wrap; }\n.contact-info { flex: 1 1 300px; max-width: 380px; }\n.contact-info .blk { margin-bottom: 26px; }\n.contact-info .h { font-weight: bold; font-size: 16px; margin-bottom: 6px; }\n.contact-info div, .contact-info a { color: var(--muted); font-size: 16px; }\n.contact-info a:hover { color: var(--accent); }\n.contact-form-col { flex: 2 1 480px; }\n\n/* ---- footer ---- */\nfooter { background: #11161c; color: #c4ccd4; padding: 56px 90px 40px 90px; font-size: 14px; }\n.foot-top { display: flex; gap: 60px; flex-wrap: wrap; }\n.foot-col { flex: 1 1 230px; }\n.foot-col.brand { flex: 1 1 300px; }\n.foot-col .h { color: #fff; font-weight: bold; font-size: 15px; margin-bottom: 12px; }\n.foot-col div { margin-bottom: 7px; }\n.foot-col a:hover { color: #fff; }\n.foot-logos { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }\n.foot-logos .ph { width: 120px; height: 44px; background: #232b34; border-color: #3a4450; color: #8a94a0; }\n.foot-logos .logo-chip {\n  background: #fff;\n  border-radius: 4px;\n  padding: 7px 12px;\n  display: flex;\n  align-items: center;\n}\n.foot-logos .logo-chip img { height: 26px; width: auto; max-width: 140px; object-fit: contain; display: block; }\n.foot-bottom {\n  border-top: 1px solid #2a323c;\n  margin-top: 40px; padding-top: 20px;\n  display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;\n  color: #7d8794;\n}\n\n/* ---- sticky tools rail ---- */\n.rail {\n  position: fixed;\n  right: 0;\n  top: 160px;\n  width: 56px;\n  background: var(--dark);\n  border-radius: 10px 0 0 10px;\n  padding: 12px 0 8px 0;\n  z-index: 50;\n  overflow: hidden;\n  opacity: 0;\n  visibility: hidden;\n  transform: translateX(10px);\n  transition: width .22s ease, opacity .22s ease, transform .22s ease, visibility .22s;\n  box-shadow: -2px 0 14px rgba(0,0,0,.18);\n}\n.rail.is-visible { opacity: 1; visibility: visible; transform: translateX(0); }\n.rail:hover, .rail:focus-within { width: 300px; }\n.rail .rt {\n  font-size: 9px; letter-spacing: 1px; color: var(--tag);\n  font-weight: bold; margin: 0 0 10px 0; text-align: center;\n  transition: margin .22s ease, text-align .22s ease;\n}\n.rail:hover .rt, .rail:focus-within .rt { margin-left: 20px; text-align: left; }\n.rail .row {\n  display: flex; align-items: center; gap: 12px;\n  padding: 8px 12px;\n  color: #fff; font-size: 14px; font-weight: bold;\n  white-space: nowrap;\n}\n.rail:hover .row, .rail:focus-within .row { padding: 8px 20px; }\n.rail .row:hover { background: rgba(255,255,255,.08); }\n.rail .ric {\n  width: 32px; height: 32px;\n  border: 1.5px solid #fff; border-radius: 6px;\n  color: #fff; font-weight: bold; font-size: 15px;\n  display: flex; align-items: center; justify-content: center;\n  flex: none;\n}\n.rail .lbl { opacity: 0; transition: opacity .18s ease; }\n.rail:hover .lbl, .rail:focus-within .lbl { opacity: 1; }\n.rail .track-field { display: none; padding: 0 20px 10px 20px; }\n.rail:hover .track-field, .rail:focus-within .track-field { display: flex; gap: 6px; }\n.rail .track-field input {\n  flex: 1 1 auto; min-width: 0;\n  border: none; border-radius: 4px;\n  padding: 7px 9px; font-size: 13px;\n}\n.rail .track-field button {\n  border: none; border-radius: 4px; cursor: pointer;\n  background: var(--accent); color: #fff; font-weight: bold;\n  padding: 7px 10px; font-size: 13px;\n}\n\n/* ---- mobile bottom tools bar ---- */\n.mobile-tools {\n  display: none;\n  position: fixed;\n  left: 0; right: 0; bottom: 0;\n  background: var(--dark);\n  z-index: 55;\n  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));\n  box-shadow: 0 -2px 14px rgba(0,0,0,.2);\n}\n.mobile-tools ul { list-style: none; display: flex; }\n.mobile-tools li { flex: 1 1 25%; }\n.mobile-tools a {\n  display: flex; flex-direction: column; align-items: center; gap: 4px;\n  color: #fff; font-size: 11px; font-weight: bold; padding: 4px;\n}\n.mobile-tools .ric {\n  width: 30px; height: 30px;\n  border: 1.5px solid #fff; border-radius: 6px;\n  display: flex; align-items: center; justify-content: center; font-size: 14px;\n}\n\n/* ===================== RESPONSIVE ===================== */\n@media (max-width: 980px) {\n  header { padding: 18px 24px; }\n  nav {\n    position: absolute; top: 100%; right: 0; left: 0;\n    flex-direction: column; align-items: flex-start; gap: 0;\n    background: #fff; border-bottom: 1px solid var(--line);\n    padding: 8px 24px 16px; display: none;\n  }\n  nav.open { display: flex; }\n  nav > a, nav .cta, nav .lang, nav .has-sub { width: 100%; padding: 12px 0; }\n  nav .has-sub > a { display: block; padding: 0; }\n  nav .sub { display: block; position: static; border: none; box-shadow: none; min-width: 0; padding: 4px 0 0 14px; }\n  nav .cta { text-align: center; padding: 12px; margin-top: 6px; }\n  .nav-toggle { display: block; }\n\n  .section-pad, .hero, .page-hero, .bands-intro, .band, .services, .why,\n  .testi, .steps, .final, .content-sec, .contact-cols, footer {\n    padding-left: 24px; padding-right: 24px;\n  }\n\n  h1, .hero h1 { font-size: 38px; }\n  h2 { font-size: 28px; }\n  .hero-sub { font-size: 18px; }\n\n  .hero, .page-hero { flex-direction: column; gap: 30px; padding-top: 45px; padding-bottom: 45px; }\n  .hero .hero-text, .page-hero .hero-text, .hero-img, .page-hero .hero-img {\n    width: 100%; max-width: 100%; flex-basis: auto;\n  }\n  .hero-img, .page-hero .hero-img { height: 240px; order: -1; }\n\n  .band { flex-direction: column; gap: 24px; padding-top: 40px; padding-bottom: 40px; }\n  .band-text, .band-img { width: 100%; max-width: 100%; flex-basis: auto; }\n  .band-img { order: -1; height: 200px; }\n\n  .svc-grid, .svc-grid-2, .tool-cards { grid-template-columns: 1fr; }\n  .checklist { columns: 1; }\n  .final h2 { font-size: 30px; }\n  .foot-bottom { flex-direction: column; }\n\n  .rail { display: none; }\n  .mobile-tools { display: block; }\n  body { padding-bottom: 64px; }\n}\n\n@media (max-width: 560px) {\n  h1, .hero h1 { font-size: 30px; }\n  .hero-ctas .btn, .final .btn { width: 100%; text-align: center; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  .rail { transition: opacity .01s; }\n}\n\n\n/* ---- minimal timeline ---- */\n#timeline .tl-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 36px; border-top: 1px solid #cfd6dc; margin-top: 56px; }\n#timeline .tl { position: relative; padding-top: 28px; }\n#timeline .tl::before { content: ''; position: absolute; top: -5px; left: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }\n#timeline .yr { font-size: 32px; font-weight: bold; color: #1d2733; letter-spacing: -0.5px; margin-bottom: 10px; }\n#timeline .tl h3 { font-size: 17px; margin-bottom: 6px; }\n#timeline .tl p { font-size: 14.5px; line-height: 1.55; color: var(--muted); }\n@media (max-width: 900px) {\n  #timeline .tl-grid { grid-template-columns: 1fr; border-top: none; border-left: 1px solid #cfd6dc; gap: 28px; margin-left: 4px; }\n  #timeline .tl { padding: 0 0 0 24px; }\n  #timeline .tl::before { top: 6px; left: -5px; }\n}\n\n/* ---- softer remix: open cards, fewer boxes ---- */\n.svc { border: none; border-top: 1px solid #d8dde3; border-radius: 0; padding: 18px 8px 6px 0; }\n.svc:hover { border-color: var(--accent); }\n.svc-grid, .svc-row { gap: 10px 40px; }\n.badge, .svc .dvb { border-radius: 999px; }\n.hero-img, .band-img { border-radius: 10px; }\n.tool-card {\n  border: none; background: #f7f8fa; border-radius: 14px;\n  box-shadow: 0 1px 0 rgba(29,39,51,.04), 0 12px 28px rgba(29,39,51,.06);\n}\n.tool-card .tic { border-radius: 50%; border-width: 1.5px; }\n.tool-card input { background: #fff; }\n\n/* ---- why cards: match homepage treatment ---- */\n.why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 44px; }\n.why-item {\n  border: 1px solid #2e3845; border-radius: 10px; padding: 32px 34px;\n  display: flex; gap: 22px; align-items: flex-start;\n  transition: border-color .2s ease, background .2s ease;\n}\n.why-item:hover { border-color: var(--accent); background: #222c37; }\n.why-item .big { font-size: 22px; }\n.why-item p { line-height: 1.55; }\n@media (max-width: 900px) { .why-grid { grid-template-columns: 1fr; } }\n\n/* ---- locations map ---- */\n.map-panel { margin-top: 30px; background: var(--grey-bg); border-radius: 12px; padding: 10px 14px 4px; }\n.content-sec.alt .map-panel { background: #fff; }\n.map-panel svg { width: 100%; height: auto; display: block; }\n.map-panel svg text { font-family: inherit; }\n.map-legend { display: flex; gap: 28px; align-items: center; padding: 4px 10px 14px; font-size: 14.5px; color: var(--muted-2); }\n.map-legend span { display: flex; align-items: center; gap: 9px; }\n.map-legend i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); display: inline-block; }\n.map-legend i.dc { background: #fff; box-shadow: inset 0 0 0 2.5px var(--accent); }\n.svc-logo { height: 40px; width: auto; max-width: 210px; object-fit: contain; display: block; margin-bottom: 12px; }\n@media (max-width: 700px) { .map-panel { padding: 6px 8px 2px; } .map-legend { gap: 16px; font-size: 13px; } }\n\n/* ---- client quotes ---- */\n.quote-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 46px; margin-top: 42px; }\n.quote { margin: 0; padding-top: 24px; border-top: 1px solid #d8dde3; position: relative; }\n.quote::before { content: ''; position: absolute; top: -1px; left: 0; width: 48px; height: 2px; background: var(--accent); }\n.quote p { font-size: 18px; line-height: 1.52; color: var(--ink); text-wrap: pretty; }\n.quote figcaption { margin-top: 20px; display: flex; flex-direction: column; gap: 3px; }\n.quote .qn { font-weight: bold; font-size: 15px; }\n.quote .qr { font-size: 14px; color: var(--muted-2); line-height: 1.4; }\n.quote .qc { font-size: 14px; font-weight: bold; color: var(--muted); }\n@media (max-width: 950px) { .quote-grid { grid-template-columns: 1fr; gap: 32px; } }\n<\u002Fstyle>\n<script src=\"9400d95a-de89-40d0-8f66-68e9a99254a5\"><\u002Fscript>\n<script src=\"21cabc33-6673-472c-9f81-da3fbaded0e3\"><\u002Fscript>\n\n\n<\u002Fhead>\n<body>\n<!-- ======================= HEADER ======================= -->\n<header>\n  <a href=\"fr-index.html\" aria-label=\"Retail Logistics Canada, accueil\">\n    <img class=\"logo-img\" src=\"770a2d5e-2ddf-4eef-8b1e-0738f7a0a7de\" alt=\"Retail Logistics Canada\">\n  <\u002Fa>\n  <button class=\"nav-toggle\" aria-label=\"Ouvrir le menu\" aria-expanded=\"false\" aria-controls=\"main-nav\">\n    <span><\u002Fspan><span><\u002Fspan><span><\u002Fspan>\n  <\u002Fbutton>\n  <nav id=\"main-nav\" aria-label=\"Main\">\n    <div class=\"has-sub\">\n      <a href=\"fr-retail-logistics.html\" aria-haspopup=\"true\">Services ▾<\u002Fa>\n      <div class=\"sub\">\n      <a href=\"fr-retail-logistics.html\">Distribution au détail et merchandising<\u002Fa>\n      <a href=\"fr-freight.html\">Transport terrestre et transfrontalier<\u002Fa>\n      <a href=\"fr-freight.html#specialized\">Transport spécialisé : dry van, reefer, intermodal<\u002Fa>\n      <a href=\"fr-freight.html#warehousing\">Entreposage et cross-docking<\u002Fa>\n      <a href=\"fr-supply-chain.html\">Consultation en chaîne d'approvisionnement<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <a href=\"fr-industries.html\">Industries<\u002Fa>\n    <a href=\"fr-about.html\">À propos<\u002Fa>\n    <a href=\"fr-contact.html\">Contact<\u002Fa>\n    <a class=\"cta\" href=\"fr-contact.html#quote\">Demander une soumission<\u002Fa>\n    <a class=\"lang\" href=\"about.html\" hreflang=\"en\" lang=\"en\">EN<\u002Fa>\n  <\u002Fnav>\n<\u002Fheader>\n\n<main>\n  <!-- ======================= HÉROS DE PAGE ======================= -->\n  <section class=\"page-hero\" id=\"top\">\n    <div class=\"hero-text\">\n      <h1>Trois compagnies. Une bannière. Un seul contact.<\u002Fh1>\n      <p class=\"hero-sub\">Depuis 2003, nous réunissons le meilleur de l'industrie canadienne du transport en un seul réseau de livraison fiable, d'un océan à l'autre.<\u002Fp>\n      <div class=\"hero-ctas\">\n        <a class=\"btn btn-primary\" href=\"fr-contact.html#quote\" data-cta=\"hero\">Demander une soumission<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <img class=\"hero-img\" src=\"ae74d4d2-d2ab-47de-8851-0c3804a456a1\" alt=\"L'équipe de Retail Logistics Canada consulte une carte du réseau canadien devant un centre de distribution\">\n  <\u002Fsection>\n\n  <!-- ======================= HISTOIRE ======================= -->\n  <section class=\"content-sec\" id=\"story\">\n    <h2>Bâti par des gens qui ont fait le travail<\u002Fh2>\n    <p class=\"lead\">Fondée en 2003, Integrated Freight Networks avait une mission claire : devenir le premier fournisseur logistique impartit de la région de Montréal. Objectif atteint, puis la portée s'est étendue à toute l'Amérique du Nord, portée par l'éthique de travail, le souci du détail et des services flexibles. Aujourd'hui, la bannière exploite une flotte privée avec des propriétaires-exploitants dédiés, des entrepôts sécurisés et un réseau solide de partenaires logistiques de confiance.<\u002Fp>\n    <p class=\"lead\">Pour répondre aux exigences propres au détail, nous avons créé Retail Logistics Canada : un réseau spécialisé et décentralisé, dirigé par des spécialistes cumulant plus de dix ans d'expérience en détail : fenêtres de livraison, accès aux bâtiments, réservation des quais et rollouts serrés, sans la paperasse. Et quand la question relève de la stratégie plutôt que de l'exécution, Integrated Transportation Solutions boucle la boucle.<\u002Fp>\n    <p class=\"lead\">L'objectif n'a jamais été de devenir la plus grande entreprise de transport au Canada, ni de prétendre offrir tous les services à tous les clients. C'était d'être le partenaire de transport et 3PL le plus fiable et le plus transparent du marché, pour des besoins spécifiques et des clients spécifiques. Nous sommes des résolveurs de problèmes, dirigés par les fondateurs depuis le premier jour, et ce que d'autres promettent, nous l'appliquons.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ======================= LIGNE DU TEMPS ======================= -->\n  <section class=\"steps\" id=\"timeline\">\n    <h2>Notre parcours<\u002Fh2>\n    <div class=\"tl-grid\">\n      <div class=\"tl\">\n        <div class=\"yr\">2003<\u002Fdiv>\n        <h3>Fondation<\u002Fh3>\n        <p>Ouverture du premier bureau et entrepôt à Montréal avec une petite équipe de spécialistes en logistique.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tl\">\n        <div class=\"yr\">2010<\u002Fdiv>\n        <h3>Nouvelle image et flotte<\u002Fh3>\n        <p>RLC acquiert sa propre flotte de camions et de remorques pour les marchés de Montréal et Toronto, puis étend le service entre le Canada et les É.-U.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tl\">\n        <div class=\"yr\">2015<\u002Fdiv>\n        <h3>Bureau et entrepôt à Toronto<\u002Fh3>\n        <p>Des bureaux et de l'entreposage dans la RGT ancrent le centre du commerce canadien, avec une couverture locale et régionale quotidienne.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tl\">\n        <div class=\"yr\">2020<\u002Fdiv>\n        <h3>Commerce électronique et pick &amp; pack<\u002Fh3>\n        <p>La distribution s'étend au traitement des commandes en ligne et aux opérations pick &amp; pack, ce qui nous donne un leadership d'industrie dans notre segment grâce à des clients fidèles.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ======================= EMPLACEMENTS ======================= -->\n  <section class=\"content-sec\" id=\"locations\">\n    <h2>Bureaux et centres de distributions<\u002Fh2>\n    <div class=\"map-panel\">\n      <svg id=\"ca-map\" role=\"img\" aria-label=\"Carte du Canada montrant les bureaux et centres de distribution de Retail Logistics Canada\"><\u002Fsvg>\n      <div class=\"map-legend\">\n        <span><i><\u002Fi>Siège social<\u002Fspan>\n        <span><i class=\"dc\"><\u002Fi>Centre de distribution<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"svc-grid\">\n      <div class=\"svc\"><span class=\"nm\">Montréal (Québec), siège social<\u002Fspan>\n        <p>Le noyau de l'entreprise, situé entre trois autoroutes majeures, rapide à réagir et point de distribution pour l'est du Canada et les Maritimes.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Toronto (Ontario)<\u002Fspan>\n        <p>Stratégiquement situé en périphérie du centre-ville pour servir les clients bâtis autour du marché de la RGT, avec couverture quotidienne et entreposage sécurisé.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Ouest canadien<\u002Fspan>\n        <p>Des entrepôts satellites à Winnipeg, Saskatoon, Calgary, Edmonton et Burnaby, chacun équipé pour le détail, le white glove et les services spécialisés.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ======================= LES TROIS DIVISIONS ======================= -->\n  <section class=\"content-sec alt\" id=\"divisions\">\n    <h2>Un guichet unique qui s'adapte aux différentes réalités de nos clients<\u002Fh2>\n    <div class=\"svc-grid\">\n      <a class=\"svc\" href=\"fr-retail-logistics.html\"><img class=\"svc-logo\" src=\"770a2d5e-2ddf-4eef-8b1e-0738f7a0a7de\" alt=\"Retail Logistics Canada\"><span class=\"dvb badge-rlc\">Livrer au détail<\u002Fspan>\n        <p>Distribution prête pour le magasin, déploiements, rénovations et merchandising en magasin.<\u002Fp><\u002Fa>\n      <a class=\"svc\" href=\"fr-freight.html\"><img class=\"svc-logo\" src=\"9810c849-329b-48b3-976a-d5183c0b991f\" alt=\"Integrated Freight Networks\"><span class=\"dvb badge-ifn\">Transporter<\u002Fspan>\n        <p>LTL, charge complète, transfrontalier Canada–É.-U., intermodal, entreposage et cross-docking.<\u002Fp><\u002Fa>\n      <a class=\"svc\" href=\"fr-supply-chain.html\"><img class=\"svc-logo\" src=\"8755531d-8db7-4d3b-bced-1b7ba6e46a1f\" alt=\"Integrated Transportation Solutions\"><span class=\"dvb badge-its\">Optimiser<\u002Fspan>\n        <p>Consultation en transport, planification logistique et optimisation de la chaîne d'approvisionnement.<\u002Fp><\u002Fa>\n    <\u002Fdiv>\n    \n  <\u002Fsection>\n\n  <!-- ======================= CERTIFICATIONS ======================= -->\n  <section class=\"why\" id=\"certifications\">\n    <h2>Nos certifications<\u002Fh2>\n    <div class=\"why-grid\">\n      <div class=\"why-item\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d98aa0\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:3px;\" aria-hidden=\"true\"><path d=\"M12 3 L4 6 V11 C4 16 7.5 19.5 12 21 C16.5 19.5 20 16 20 11 V6 Z\"><\u002Fpath><path d=\"M9 12 L11 14 L15 9.5\"><\u002Fpath><\u002Fsvg>\n        <div>\n          <span class=\"big\">CTPAT · PIP · FAST<\u002Fspan>\n          <p>Agents transfrontaliers certifiés sur les routes Canada–É.-U.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why-item\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d98aa0\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:3px;\" aria-hidden=\"true\"><path d=\"M12 4 L22 20 H2 Z\"><\u002Fpath><path d=\"M12 10 V14\"><\u002Fpath><path d=\"M12 16.8 V17\"><\u002Fpath><\u002Fsvg>\n        <div>\n          <span class=\"big\">Alimentaire, pharma et HAZMAT<\u002Fspan>\n          <p>Équipements certifiés et équipes accréditées pour le fret réglementé.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why-item\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d98aa0\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:3px;\" aria-hidden=\"true\"><path d=\"M12 3 L4 6 V11 C4 16 7.5 19.5 12 21 C16.5 19.5 20 16 20 11 V6 Z\"><\u002Fpath><\u002Fsvg>\n        <div>\n          <span class=\"big\">Entièrement assuré<\u002Fspan>\n          <p>Certification complète et couverture d'assurance sur chaque déplacement.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- Adhésions affichées sur le site actuel, confirmer qu'elles sont actives -->\n      <div class=\"why-item\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d98aa0\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:3px;\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 20 C4 16 8 14.5 12 14.5 C16 14.5 20 16 20 20\"><\u002Fpath><\u002Fsvg>\n        <div>\n          <span class=\"big\">Associations de l'industrie<\u002Fspan>\n          <p>Membre du Conseil canadien du commerce de détail, CQCD et A.R.E.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ======================= TÉMOIGNAGES ======================= -->\n  <section class=\"testi\" id=\"testimonials\">\n    <h2>Ce que disent nos clients<\u002Fh2>\n    <div class=\"quote-grid\">\n      <figure class=\"quote\">\n        <p>« Leur engagement envers un service impeccable a été déterminant dans le lancement réussi et l’expansion continue de notre plus récente division. »<\u002Fp>\n        <figcaption><span class=\"qn\">Keith Burrows<\u002Fspan><span class=\"qr\">Premier vice-président, distribution et logistique<\u002Fspan><span class=\"qc\">La Senza<\u002Fspan><\u002Ffigcaption>\n      <\u002Ffigure>\n      <figure class=\"quote\">\n        <p>« Travailler avec Retail Logistics Canada nous a libérés de la planification et de l’exécution de ces livraisons, pour que nous puissions nous concentrer sur notre cœur de métier. »<\u002Fp>\n        <figcaption><span class=\"qn\">Tina Matteo<\u002Fspan><span class=\"qr\">Directrice des opérations<\u002Fspan><span class=\"qc\">Prime Construction &amp; Management<\u002Fspan><\u002Ffigcaption>\n      <\u002Ffigure>\n      <figure class=\"quote\">\n        <p>« Dès le début de notre collaboration, nous leur avons simplement confié toutes les exigences de livraison particulières. »<\u002Fp>\n        <figcaption><span class=\"qn\">Shawn Coveny<\u002Fspan><span class=\"qr\">Président<\u002Fspan><span class=\"qc\">Federal Steel Equipment<\u002Fspan><\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ======================= CTA FINAL ======================= -->\n  <section class=\"final\" id=\"quote\">\n    <h2>Prêt à simplifier votre logistique ?<\u002Fh2>\n    <p>Un seul contact pour la distribution au détail, le transport et l'expertise en chaîne d'approvisionnement.<\u002Fp>\n    <a class=\"btn btn-primary\" href=\"fr-contact.html#quote\" data-cta=\"final\">Demander une soumission<\u002Fa>\n  <\u002Fsection>\n<\u002Fmain>\n\n<!-- ======================= FOOTER ======================= -->\n<footer id=\"contact-footer\">\n  <div class=\"foot-top\">\n    <div class=\"foot-col brand\">\n      <div class=\"h\">Retail Logistics Canada<\u002Fdiv>\n      <div>Une bannière, trois compagnies :<\u002Fdiv>\n      <div class=\"foot-logos\">\n        <!-- Navy logos sit on white chips in the dark footer; swap for\n             white/reversed versions if the client provides them. -->\n        <span class=\"logo-chip\"><img src=\"770a2d5e-2ddf-4eef-8b1e-0738f7a0a7de\" alt=\"Retail Logistics Canada\"><\u002Fspan>\n        <span class=\"logo-chip\"><img src=\"9810c849-329b-48b3-976a-d5183c0b991f\" alt=\"Integrated Freight Networks\"><\u002Fspan>\n        <span class=\"logo-chip\"><img src=\"8755531d-8db7-4d3b-bced-1b7ba6e46a1f\" alt=\"Integrated Transportation Solutions\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot-col\">\n      <div class=\"h\">Services<\u002Fdiv>\n      <div><a href=\"fr-retail-logistics.html\">Distribution au détail et merchandising<\u002Fa><\u002Fdiv>\n      <div><a href=\"fr-freight.html\">Transport terrestre et transfrontalier<\u002Fa><\u002Fdiv>\n      <div><a href=\"fr-freight.html#specialized\">Transport spécialisé<\u002Fa><\u002Fdiv>\n      <div><a href=\"fr-freight.html#warehousing\">Entreposage et cross-docking<\u002Fa><\u002Fdiv>\n      <div><a href=\"fr-supply-chain.html\">Consultation en chaîne d'approvisionnement<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n    <div clas lse');\n      }\n    });\n  }\n})();\n\n// Sticky rail: appears only after the page hero scrolls out of view,\n// and never overlaps the footer.\n(function () {\n  var rail = document.getElementById('tools-rail');\n  var hero = document.getElementById('top');\n  var footer = document.querySelector('footer');\n  if (!rail || !hero) return;\n\n  var pastHero = false;\n  var atFooter = false;\n\n  function update() {\n    rail.classList.toggle('is-visible', pastHero && !atFooter);\n  }\n\n  if ('IntersectionObserver' in window) {\n    new IntersectionObserver(function (entries) {\n      pastHero = !entries[0].isIntersecting;\n      update();\n    }, { rootMargin: '-80px 0px 0px 0px' }).observe(hero);\n\n    if (footer) {\n      new IntersectionObserver(function (entries) {\n        atFooter = entries[0].isIntersecting;\n        update();\n      }, { rootMargin: '0px 0px -40px 0px' }).observe(footer);\n    }\n  } else {\n    window.addEventListener('scroll', function () {\n      pastHero = window.scrollY > hero.offsetHeight;\n      update();\n    }, { passive: true });\n  }\n})();\n\n<\u002Fscript>\n\n<script>\n(function () {\n  var W = 1180, H = 470;\n  var CITIES = [{\"n\":\"Montréal (QC)\",\"c\":[-73.57,45.5],\"hq\":true,\"a\":\"start\",\"dx\":17,\"dy\":-3},{\"n\":\"Toronto (ON)\",\"c\":[-79.38,43.65],\"a\":\"end\",\"dx\":-13,\"dy\":8},{\"n\":\"Winnipeg (MB)\",\"c\":[-97.14,49.9],\"a\":\"start\",\"dx\":13,\"dy\":6},{\"n\":\"Saskatoon (SK)\",\"c\":[-106.67,52.13],\"a\":\"start\",\"dx\":13,\"dy\":-2},{\"n\":\"Calgary (AB)\",\"c\":[-114.07,51.05],\"a\":\"start\",\"dx\":14,\"dy\":26},{\"n\":\"Edmonton (AB)\",\"c\":[-113.49,53.55],\"a\":\"end\",\"dx\":-14,\"dy\":-7},{\"n\":\"Burnaby (C.-B.)\",\"c\":[-122.98,49.25],\"a\":\"end\",\"dx\":-14,\"dy\":4}];\n  var svg = d3.select('#ca-map').attr('viewBox', '0 0 ' + W + ' ' + H).attr('preserveAspectRatio', 'xMidYMid meet');\n  var frame = { type: 'LineString', coordinates: [[-131, 40], [-110, 40], [-85, 40], [-54, 40], [-54, 50], [-54, 59], [-95, 59], [-131, 59], [-131, 50], [-131, 40]] };\n  var proj = d3.geoConicConformal().rotate([96, 0]).parallels([46, 62]).fitExtent([[10, 10], [W - 10, H - 10]], frame);\n  proj.clipExtent([[0, 0], [W, H]]);\n  var geo = d3.geoPath(proj);\n  d3.json(window.__resources ? window.__resources.worldAtlas : 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(function (topo) {\n    var feats = topojson.feature(topo, topo.objects.countries).features;\n    var land = svg.append('g');\n    land.append('g').selectAll('path')\n      .data(feats.filter(function (d) { return d.properties.name !== 'Canada'; }))\n      .join('path').attr('d', geo).attr('fill', '#dde4ea').attr('stroke', '#fff').attr('stroke-width', 1);\n    land.append('g').selectAll('path')\n      .data(feats.filter(function (d) { return d.properties.name === 'Canada'; }))\n      .join('path').attr('d', geo).attr('fill', '#fff').attr('stroke', '#b9c3cc').attr('stroke-width', 1.2);\n    var pins = svg.append('g').selectAll('g').data(CITIES).join('g')\n      .attr('transform', function (d) { var p = proj(d.c); return 'translate(' + p[0] + ',' + p[1] + ')'; });\n    pins.filter(function (d) { return d.hq; }).append('circle').attr('r', 17).attr('fill', '#C8102E').attr('opacity', 0.14);\n    pins.append('circle')\n      .attr('r', function (d) { return d.hq ? 7 : 5.5; })\n      .attr('fill', function (d) { return d.hq ? '#C8102E' : '#fff'; })\n      .attr('stroke', '#C8102E').attr('stroke-width', function (d) { return d.hq ? 2 : 2.5; });\n    pins.append('text').text(function (d) { return d.n; })\n      .attr('text-anchor', function (d) { return d.a; })\n      .attr('x', function (d) { return d.dx; })\n      .attr('y', function (d) { return d.dy; })\n      .attr('dominant-baseline', 'middle')\n      .attr('font-size', function (d) { return d.hq ? 17 : 16; })\n      .attr('font-weight', 400)\n      .attr('fill', '#1d2733')\n      .attr('stroke', '#fff').attr('stroke-width', 4).attr('paint-order', 'stroke');\n  });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
