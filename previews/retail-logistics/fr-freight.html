    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';

      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;
    }
    window.addEventListener('message', function (e) {

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        if (isPageRoot || window.parent === window) return; // authoritative miss

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"fr\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Transport terrestre et transfrontalier Canada–É.-U. | Integrated Freight Networks<\u002Ftitle>\n<meta name=\"description\" content=\"LTL et charge complète au Canada et aux É.-U. : dry van, réfrigéré, intermodal et express, plus entreposage sécurisé et cross-docking. Suivi en temps réel, sans connexion.\">\n<link rel=\"alternate\" hreflang=\"en-CA\" href=\"https://retaillogistics.ca/freight.html\">\n<link rel=\"alternate\" hreflang=\"fr-CA\" href=\"https://retaillogistics.ca/fr/freight.html\">\n<link rel=\"alternate\" hreflang=\"x-default\" href=\"https://retaillogistics.ca/freight.html\">\n<link rel=\"canonical\" href=\"https://retaillogistics.ca/fr/freight.html\">\n<style>\n/* ============================================================\n   Retail Logistics Canada: shared design system\n   Extracted from the approved homepage mockup (index.html).\n   Accent #C8102E · Dark #1D2733 · Grey bg #F4F6F8\n   ============================================================ */\n:root {\n  --accent: #C8102E;\n  --dark: #1d2733;\n  --ink: #1d2733;\n  --muted: #444f5b;\n  --muted-2: #5d6873;\n  --grey-bg: #f4f6f8;\n  --line: #e3e7eb;\n  --tag: #8a94a0;\n}\n\n* { margin: 0; padding: 0; box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nbody {\n  font-family: Helvetica, Arial, sans-serif;\n  color: var(--ink);\n  font-size: 17px;\n  line-height: 1.5;\n  background: #fff;\n}\nimg { max-width: 100%; display: block; }\na { color: inherit; text-decoration: none; }\n.wrap { max-width: 1280px; margin: 0 auto; }\n\n/* ---- shared bits ---- */\n.btn {\n  display: inline-block;\n  padding: 16px 34px;\n  border-radius: 4px;\n  font-weight: bold;\n  font-size: 17px;\n  cursor: pointer;\n  border: none;\n}\n.btn-primary { background: var(--accent); color: #fff; }\n.btn-primary:hover { background: #a50d26; }\n.btn-ghost { border: 2px solid var(--dark); color: var(--dark); padding: 14px 32px; }\n.btn-ghost:hover { background: var(--dark); color: #fff; }\n\n.tag {\n  display: inline-block;\n  font-size: 12px;\n  letter-spacing: 1.2px;\n  text-transform: uppercase;\n  color: var(--tag);\n  font-weight: bold;\n}\n\n.ph {\n  background: #e6eaee;\n  border: 1px dashed #b3bcc6;\n  color: #7d8794;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 13px;\n  font-style: italic;\n  text-align: center;\n  padding: 10px;\n}\n\nh2 { font-size: 34px; line-height: 1.2; }\n.section-pad { padding: 65px 90px; }\n\n/* ---- header ---- */\nheader {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 26px 90px;\n  border-bottom: 1px solid var(--line);\n  position: sticky;\n  top: 0;\n  background: #fff;\n  z-index: 60;\n}\n.logo-box { width: 220px; height: 52px; }\n.logo-img { width: auto; height: 48px; max-width: 240px; object-fit: contain; display: block; }\nnav { display: flex; align-items: center; gap: 34px; font-size: 16px; font-weight: bold; }\nnav > a:hover, nav .has-sub > a:hover { color: var(--accent); }\nnav .cta { background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 4px; }\nnav .cta:hover { background: #a50d26; color: #fff; }\nnav .lang { color: var(--tag); font-weight: normal; }\n\n/* services dropdown */\nnav .has-sub { position: relative; }\nnav .sub {\n  display: none;\n  position: absolute;\n  top: 100%;\n  left: -18px;\n  background: #fff;\n  border: 1px solid var(--line);\n  border-radius: 0 0 6px 6px;\n  box-shadow: 0 8px 22px rgba(0,0,0,.10);\n  min-width: 300px;\n  padding: 10px 0;\n  z-index: 70;\n}\nnav .has-sub:hover .sub, nav .has-sub:focus-within .sub { display: block; }\nnav .sub a { display: block; padding: 10px 20px; font-size: 15px; font-weight: normal; }\nnav .sub a:hover { background: var(--grey-bg); color: var(--accent); }\nnav .sub .grp {\n  font-size: 10px; letter-spacing: 1px; text-transform: uppercase;\n  color: var(--tag); font-weight: bold; padding: 10px 20px 4px 20px;\n}\n\n.nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 8px; }\n.nav-toggle span { display: block; width: 26px; height: 3px; background: var(--dark); margin: 5px 0; border-radius: 2px; }\n\n/* ---- page hero (interior pages) ---- */\n.page-hero { display: flex; gap: 60px; padding: 65px 90px 55px 90px; align-items: center; }\n.page-hero .hero-text { flex: 1 1 580px; max-width: 620px; }\nh1 { font-size: 46px; line-height: 1.12; margin: 0 0 20px 0; }\n.hero-sub { font-size: 20px; color: var(--muted); margin-bottom: 30px; }\n.hero-ctas { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }\n.hero-proof { font-size: 15px; color: var(--muted-2); }\n.page-hero .hero-img { flex: 0 0 460px; width: 460px; height: 320px; object-fit: cover; border-radius: 6px; }\n\n/* home hero keeps larger H1 */\n.hero { display: flex; gap: 60px; padding: 75px 90px 65px 90px; align-items: center; }\n.hero .hero-text { flex: 1 1 580px; max-width: 580px; }\n.hero h1 { font-size: 52px; }\n.hero-img { flex: 0 0 460px; width: 460px; height: 340px; object-fit: cover; border-radius: 6px; }\n\n/* ---- badges ---- */\n.badge {\n  display: inline-block;\n  font-size: 13px;\n  font-weight: bold;\n  letter-spacing: 1px;\n  text-transform: uppercase;\n  padding: 6px 14px;\n  border-radius: 4px;\n  margin-bottom: 16px;\n}\n.badge-rlc { background: #FBEAF0; color: #72243E; }\n.badge-ifn { background: #E6F1FB; color: #0C447C; }\n.badge-its { background: #E1F5EE; color: #085041; }\n\n/* ---- division bands (home) ---- */\n.bands-intro { padding: 55px 90px 10px 90px; }\n.band { display: flex; gap: 70px; align-items: center; padding: 55px 90px; }\n.band.alt { background: var(--grey-bg); }\n.band-text { flex: 1 1 600px; max-width: 600px; }\n.band-img { flex: 0 0 430px; width: 430px; height: 230px; object-fit: cover; border-radius: 6px; }\n.band h3 { font-size: 30px; margin-bottom: 12px; }\n.band p { font-size: 17px; color: var(--muted); margin-bottom: 16px; }\n.band a.band-link { color: var(--accent); font-weight: bold; font-size: 17px; }\n.band a.band-link:hover { text-decoration: underline; }\n\n/* ---- services / card grids ---- */\n.services { padding: 65px 90px 55px 90px; }\n.svc-row { display: flex; gap: 18px; margin-top: 32px; flex-wrap: wrap; }\n.svc { border: 1px solid #d8dde3; border-radius: 4px; padding: 20px 18px; flex: 1 1 205px; }\n.svc .nm { font-weight: bold; font-size: 16px; line-height: 1.3; display: block; margin-bottom: 10px; }\n.svc .dvb {\n  display: inline-block;\n  font-size: 10px;\n  font-weight: bold;\n  letter-spacing: 0.6px;\n  text-transform: uppercase;\n  padding: 3px 8px;\n  border-radius: 3px;\n}\n.svc p { font-size: 15px; color: var(--muted); margin-top: 8px; }\n.svc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 32px; }\n.svc-grid .svc { flex: none; }\n.svc-grid-2 { grid-template-columns: repeat(2, 1fr); }\n\n/* ---- checklist ---- */\n.checklist { columns: 2; column-gap: 50px; margin-top: 28px; }\n.checklist li {\n  list-style: none;\n  break-inside: avoid;\n  padding: 10px 0 10px 34px;\n  position: relative;\n  font-size: 17px;\n  color: var(--muted);\n}\n.checklist li::before {\n  content: \"✓\";\n  position: absolute;\n  left: 0; top: 8px;\n  width: 22px; height: 22px;\n  border-radius: 12px;\n  background: var(--accent);\n  color: #fff;\n  font-size: 13px;\n  font-weight: bold;\n  display: flex; align-items: center; justify-content: center;\n}\n\n/* ---- dark section (why / certifications) ---- */\n.why { padding: 65px 90px; background: var(--dark); color: #fff; }\n.why h2 { color: #fff; }\n.why-grid { display: flex; gap: 30px; margin-top: 40px; flex-wrap: wrap; }\n.why-item { flex: 1 1 250px; }\n.why-item .big { font-size: 21px; font-weight: bold; display: block; margin-bottom: 8px; }\n.why-item p { font-size: 15px; color: #c4ccd4; }\n\n/* ---- testimonial ---- */\n.testi { padding: 65px 90px; }\n.testi blockquote { font-size: 25px; line-height: 1.45; max-width: 880px; }\n.testi .who { margin-top: 18px; font-size: 16px; color: var(--muted-2); font-weight: bold; }\n\n/* ---- steps ---- */\n.steps { background: var(--grey-bg); padding: 65px 90px; }\n.steps-grid { display: flex; gap: 28px; margin-top: 36px; flex-wrap: wrap; }\n.step { flex: 1 1 300px; }\n.step .num {\n  width: 44px; height: 44px; border-radius: 22px;\n  background: var(--accent); color: #fff; font-weight: bold; font-size: 20px;\n  display: flex; align-items: center; justify-content: center; margin-bottom: 14px;\n}\n.step h3 { font-size: 21px; margin-bottom: 8px; }\n.step p { font-size: 16px; color: var(--muted); }\n\n/* ---- final CTA ---- */\n.final { padding: 75px 90px; text-align: center; }\n.final h2 { font-size: 40px; }\n.final p { font-size: 18px; color: var(--muted-2); margin: 14px 0 30px 0; }\n\n/* ---- generic content section ---- */\n.content-sec { padding: 65px 90px; }\n.content-sec.alt { background: var(--grey-bg); }\n.content-sec h2 { margin-top: 6px; }\n.content-sec .lead { font-size: 18px; color: var(--muted); max-width: 760px; margin-top: 14px; }\n\n/* ---- pending-content placeholder (client to provide) ---- */\n.pending {\n  border: 1px dashed #b3bcc6;\n  background: #fbfcfd;\n  border-radius: 6px;\n  padding: 22px 26px;\n  margin-top: 28px;\n  color: #7d8794;\n  font-style: italic;\n  font-size: 15px;\n}\n\n/* ---- tool cards ---- */\n.tool-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; margin-top: 36px; }\n.tool-card {\n  border: 1px solid #d8dde3;\n  border-radius: 6px;\n  padding: 28px;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n.tool-card .tic {\n  width: 44px; height: 44px;\n  border: 2px solid var(--dark); border-radius: 8px;\n  font-size: 20px; font-weight: bold;\n  display: flex; align-items: center; justify-content: center;\n  margin-bottom: 6px;\n}\n.tool-card h3 { font-size: 22px; }\n.tool-card p { font-size: 16px; color: var(--muted); flex: 1; }\n.tool-card .btn { align-self: flex-start; padding: 12px 26px; font-size: 16px; }\n.tool-card form { display: flex; gap: 8px; margin-top: 4px; }\n.tool-card input {\n  flex: 1 1 auto; min-width: 0;\n  border: 1px solid #d8dde3; border-radius: 4px;\n  padding: 10px 12px; font-size: 15px;\n}\n\n/* ---- quote form ---- */\n.quote-form { margin-top: 36px; max-width: 860px; }\n.quote-form fieldset { border: none; margin-bottom: 34px; }\n.quote-form legend {\n  font-size: 21px; font-weight: bold; margin-bottom: 18px;\n  padding-top: 8px;\n}\n.form-row { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }\n.form-field { flex: 1 1 240px; display: flex; flex-direction: column; gap: 6px; }\n.form-field.full { flex-basis: 100%; }\n.form-field label { font-size: 14px; font-weight: bold; }\n.form-field input, .form-field select, .form-field textarea {\n  border: 1px solid #c9d0d7; border-radius: 4px;\n  padding: 12px 12px; font-size: 16px; font-family: inherit;\n  background: #fff;\n}\n.form-field textarea { min-height: 120px; resize: vertical; }\n.form-checks { display: flex; gap: 10px 26px; flex-wrap: wrap; margin-bottom: 6px; }\n.form-checks label {\n  display: flex; align-items: center; gap: 8px;\n  font-size: 15px; color: var(--muted); font-weight: normal;\n}\n.form-note { font-size: 14px; color: var(--muted-2); margin-top: 10px; }\n\n/* ---- contact layout ---- */\n.contact-cols { display: flex; gap: 70px; padding: 65px 90px; flex-wrap: wrap; }\n.contact-info { flex: 1 1 300px; max-width: 380px; }\n.contact-info .blk { margin-bottom: 26px; }\n.contact-info .h { font-weight: bold; font-size: 16px; margin-bottom: 6px; }\n.contact-info div, .contact-info a { color: var(--muted); font-size: 16px; }\n.contact-info a:hover { color: var(--accent); }\n.contact-form-col { flex: 2 1 480px; }\n\n/* ---- footer ---- */\nfooter { background: #11161c; color: #c4ccd4; padding: 56px 90px 40px 90px; font-size: 14px; }\n.foot-top { display: flex; gap: 60px; flex-wrap: wrap; }\n.foot-col { flex: 1 1 230px; }\n.foot-col.brand { flex: 1 1 300px; }\n.foot-col .h { color: #fff; font-weight: bold; font-size: 15px; margin-bottom: 12px; }\n.foot-col div { margin-bottom: 7px; }\n.foot-col a:hover { color: #fff; }\n.foot-logos { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }\n.foot-logos .ph { width: 120px; height: 44px; background: #232b34; border-color: #3a4450; color: #8a94a0; }\n.foot-logos .logo-chip {\n  background: #fff;\n  border-radius: 4px;\n  padding: 7px 12px;\n  display: flex;\n  align-items: center;\n}\n.foot-logos .logo-chip img { height: 26px; width: auto; max-width: 140px; object-fit: contain; display: block; }\n.foot-bottom {\n  border-top: 1px solid #2a323c;\n  margin-top: 40px; padding-top: 20px;\n  display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;\n  color: #7d8794;\n}\n\n/* ---- sticky tools rail ---- */\n.rail {\n  position: fixed;\n  right: 0;\n  top: 160px;\n  width: 56px;\n  background: var(--dark);\n  border-radius: 10px 0 0 10px;\n  padding: 12px 0 8px 0;\n  z-index: 50;\n  overflow: hidden;\n  opacity: 0;\n  visibility: hidden;\n  transform: translateX(10px);\n  transition: width .22s ease, opacity .22s ease, transform .22s ease, visibility .22s;\n  box-shadow: -2px 0 14px rgba(0,0,0,.18);\n}\n.rail.is-visible { opacity: 1; visibility: visible; transform: translateX(0); }\n.rail:hover, .rail:focus-within { width: 300px; }\n.rail .rt {\n  font-size: 9px; letter-spacing: 1px; color: var(--tag);\n  font-weight: bold; margin: 0 0 10px 0; text-align: center;\n  transition: margin .22s ease, text-align .22s ease;\n}\n.rail:hover .rt, .rail:focus-within .rt { margin-left: 20px; text-align: left; }\n.rail .row {\n  display: flex; align-items: center; gap: 12px;\n  padding: 8px 12px;\n  color: #fff; font-size: 14px; font-weight: bold;\n  white-space: nowrap;\n}\n.rail:hover .row, .rail:focus-within .row { padding: 8px 20px; }\n.rail .row:hover { background: rgba(255,255,255,.08); }\n.rail .ric {\n  width: 32px; height: 32px;\n  border: 1.5px solid #fff; border-radius: 6px;\n  color: #fff; font-weight: bold; font-size: 15px;\n  display: flex; align-items: center; justify-content: center;\n  flex: none;\n}\n.rail .lbl { opacity: 0; transition: opacity .18s ease; }\n.rail:hover .lbl, .rail:focus-within .lbl { opacity: 1; }\n.rail .track-field { display: none; padding: 0 20px 10px 20px; }\n.rail:hover .track-field, .rail:focus-within .track-field { display: flex; gap: 6px; }\n.rail .track-field input {\n  flex: 1 1 auto; min-width: 0;\n  border: none; border-radius: 4px;\n  padding: 7px 9px; font-size: 13px;\n}\n.rail .track-field button {\n  border: none; border-radius: 4px; cursor: pointer;\n  background: var(--accent); color: #fff; font-weight: bold;\n  padding: 7px 10px; font-size: 13px;\n}\n\n/* ---- mobile bottom tools bar ---- */\n.mobile-tools {\n  display: none;\n  position: fixed;\n  left: 0; right: 0; bottom: 0;\n  background: var(--dark);\n  z-index: 55;\n  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));\n  box-shadow: 0 -2px 14px rgba(0,0,0,.2);\n}\n.mobile-tools ul { list-style: none; display: flex; }\n.mobile-tools li { flex: 1 1 25%; }\n.mobile-tools a {\n  display: flex; flex-direction: column; align-items: center; gap: 4px;\n  color: #fff; font-size: 11px; font-weight: bold; padding: 4px;\n}\n.mobile-tools .ric {\n  width: 30px; height: 30px;\n  border: 1.5px solid #fff; border-radius: 6px;\n  display: flex; align-items: center; justify-content: center; font-size: 14px;\n}\n\n/* ===================== RESPONSIVE ===================== */\n@media (max-width: 980px) {\n  header { padding: 18px 24px; }\n  nav {\n    position: absolute; top: 100%; right: 0; left: 0;\n    flex-direction: column; align-items: flex-start; gap: 0;\n    background: #fff; border-bottom: 1px solid var(--line);\n    padding: 8px 24px 16px; display: none;\n  }\n  nav.open { display: flex; }\n  nav > a, nav .cta, nav .lang, nav .has-sub { width: 100%; padding: 12px 0; }\n  nav .has-sub > a { display: block; padding: 0; }\n  nav .sub { display: block; position: static; border: none; box-shadow: none; min-width: 0; padding: 4px 0 0 14px; }\n  nav .cta { text-align: center; padding: 12px; margin-top: 6px; }\n  .nav-toggle { display: block; }\n\n  .section-pad, .hero, .page-hero, .bands-intro, .band, .services, .why,\n  .testi, .steps, .final, .content-sec, .contact-cols, footer {\n    padding-left: 24px; padding-right: 24px;\n  }\n\n  h1, .hero h1 { font-size: 38px; }\n  h2 { font-size: 28px; }\n  .hero-sub { font-size: 18px; }\n\n  .hero, .page-hero { flex-direction: column; gap: 30px; padding-top: 45px; padding-bottom: 45px; }\n  .hero .hero-text, .page-hero .hero-text, .hero-img, .page-hero .hero-img {\n    width: 100%; max-width: 100%; flex-basis: auto;\n  }\n  .hero-img, .page-hero .hero-img { height: 240px; order: -1; }\n\n  .band { flex-direction: column; gap: 24px; padding-top: 40px; padding-bottom: 40px; }\n  .band-text, .band-img { width: 100%; max-width: 100%; flex-basis: auto; }\n  .band-img { order: -1; height: 200px; }\n\n  .svc-grid, .svc-grid-2, .tool-cards { grid-template-columns: 1fr; }\n  .checklist { columns: 1; }\n  .final h2 { font-size: 30px; }\n  .foot-bottom { flex-direction: column; }\n\n  .rail { display: none; }\n  .mobile-tools { display: block; }\n  body { padding-bottom: 64px; }\n}\n\n@media (max-width: 560px) {\n  h1, .hero h1 { font-size: 30px; }\n  .hero-ctas .btn, .final .btn { width: 100%; text-align: center; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  .rail { transition: opacity .01s; }\n}\n\n\n/* ---- sub-service descriptions: hidden until hover ---- */\n.svc { position: relative; cursor: default; transition: border-color .15s ease; }\n.svc .nm { margin-bottom: 0; }\n.svc p { display: none; }\n.svc:hover { border-color: var(--accent); }\n.svc:hover p {\n  display: block; position: absolute; left: -10px; right: -10px; top: calc(100% + 4px);\n  z-index: 40; margin: 0; background: #fff;\n  border: none; border-radius: 10px;\n  padding: 14px 16px; font-size: 14px; line-height: 1.5; color: var(--muted);\n  box-shadow: 0 4px 10px rgba(29,39,51,.08), 0 18px 40px rgba(29,39,51,.16);\n}\n\n/* ---- softer remix: open cards, fewer boxes ---- */\n.svc { border: none; border-top: 1px solid #d8dde3; border-radius: 0; padding: 18px 8px 6px 0; }\n.svc:hover { border-color: var(--accent); }\n.svc-grid, .svc-row { gap: 10px 40px; }\n.badge, .svc .dvb { border-radius: 999px; }\n.hero-img, .band-img { border-radius: 10px; }\n.tool-card {\n  border: none; background: #f7f8fa; border-radius: 14px;\n  box-shadow: 0 1px 0 rgba(29,39,51,.04), 0 12px 28px rgba(29,39,51,.06);\n}\n.tool-card .tic { border-radius: 50%; border-width: 1.5px; }\n.tool-card input { background: #fff; }\n\n/* ---- why cards: match homepage treatment ---- */\n.why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 44px; }\n.why-item {\n  border: 1px solid #2e3845; border-radius: 10px; padding: 32px 34px;\n  display: flex; gap: 22px; align-items: flex-start;\n  transition: border-color .2s ease, background .2s ease;\n}\n.why-item:hover { border-color: var(--accent); background: #222c37; }\n.why-item .big { font-size: 22px; }\n.why-item p { line-height: 1.55; }\n@media (max-width: 900px) { .why-grid { grid-template-columns: 1fr; } }\n\n/* ---- division logos replace colored pills ---- */\n.div-logo { height: 44px; width: auto; display: block; margin-bottom: 18px; }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<!-- ======================= HEADER ======================= -->\n<header>\n  <a href=\"fr-index.html\" aria-label=\"Retail Logistics Canada, accueil\">\n    <img class=\"logo-img\" src=\"7b3925a8-dc44-4eae-b7cf-2792683d80be\" alt=\"Retail Logistics Canada\">\n  <\u002Fa>\n  <button class=\"nav-toggle\" aria-label=\"Ouvrir le menu\" aria-expanded=\"false\" aria-controls=\"main-nav\">\n    <span><\u002Fspan><span><\u002Fspan><span><\u002Fspan>\n  <\u002Fbutton>\n  <nav id=\"main-nav\" aria-label=\"Main\">\n    <div class=\"has-sub\">\n      <a href=\"fr-retail-logistics.html\" aria-haspopup=\"true\">Services ▾<\u002Fa>\n      <div class=\"sub\">\n      <a href=\"fr-retail-logistics.html\">Distribution au détail et merchandising<\u002Fa>\n      <a href=\"fr-freight.html\">Transport terrestre et transfrontalier<\u002Fa>\n      <a href=\"fr-freight.html#specialized\">Transport spécialisé : dry van, reefer, intermodal<\u002Fa>\n      <a href=\"fr-freight.html#warehousing\">Entreposage et cross-docking<\u002Fa>\n      <a href=\"fr-supply-chain.html\">Consultation en chaîne d'approvisionnement<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <a href=\"fr-industries.html\">Industries<\u002Fa>\n    <a href=\"fr-about.html\">À propos<\u002Fa>\n    <a href=\"fr-contact.html\">Contact<\u002Fa>\n    <a class=\"cta\" href=\"fr-contact.html#quote\">Demander une soumission<\u002Fa>\n    <a class=\"lang\" href=\"freight.html\" hreflang=\"en\" lang=\"en\">EN<\u002Fa>\n  <\u002Fnav>\n<\u002Fheader>\n\n<main>\n  <!-- ======================= HÉROS DE PAGE ======================= -->\n  <section class=\"page-hero\" id=\"top\">\n    <div class=\"hero-text\">\n      <img class=\"div-logo\" src=\"a71606ce-86e0-439f-bdc1-768000ae9c2d\" alt=\"Integrated Freight Networks\">\n      <h1>Une gestion de transport rapide, professionnelle et fiable<\u002Fh1>\n      <p class=\"hero-sub\">LTL et charge complète au Canada et aux É.-U. : dry van, réfrigéré et chauffé, intermodal et express, appuyés par notre flotte et nos entrepôts sécurisés.<\u002Fp>\n      <div class=\"hero-ctas\">\n        <a class=\"btn btn-primary\" href=\"fr-contact.html#quote\" data-cta=\"hero\">Soumission de transport<\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"https://tracking.integratedfn.com/DMWeb\" target=\"_blank\" rel=\"noopener\" data-cta=\"track\">Suivre une expédition<\u002Fa>\n      <\u002Fdiv>\n      <p class=\"hero-proof\">Un réseau continental de transporteurs spécialisés : un seul contact, une couverture inégalée.<\u002Fp>\n    <\u002Fdiv>\n    <img class=\"hero-img\" src=\"e32ea0c4-84eb-4c6e-b17a-1f250d2b2210\" alt=\"Quais de chargement d’un centre de distribution\" style=\"object-position:53% 74%;\">\n  <\u002Fsection>\n\n  <!-- ======================= SERVICES =======================\n       Aérien et maritime retirés (rencontre client du 10 juin).\n       Transfrontalier = Canada–É.-U. seulement. L'intermodal reste. -->\n  <section class=\"content-sec\" id=\"specialized\">\n    <h2>Le bon équipement pour chaque chargement<\u002Fh2>\n    <div class=\"svc-grid\">\n      <div class=\"svc\"><span class=\"nm\">Charge complète : dry van, reefer et chauffé<\u002Fspan>\n        <p>Capacité en charge complète, y compris remorques à température contrôlée, porte à porte.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">LTL au Canada et aux É.-U.<\u002Fspan>\n        <p>Un réseau LTL établi, avec options porte-à-porte ajustées à votre budget.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Transfrontalier terrestre<\u002Fspan>\n        <p>Des passages Canada–É.-U. rapides et précis, agents certifiés CTPAT, PIP et FAST.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Intermodal (rail)<\u002Fspan>\n        <p>De vraies économies quand l’échéance le permet, jusqu’à 60 000 lb par conteneur.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Express terrestre<\u002Fspan>\n        <p>Un service express qui tient vos engagements quand la production prend du retard.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Camionnage avec flotte propre<\u002Fspan>\n        <p>Notre flotte interne : camions dédiés, distribution groupée, service de soir et de fin de semaine.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ======================= ENTREPOSAGE ======================= -->\n  <section class=\"content-sec alt\" id=\"warehousing\">\n    <h2>Entreposage et cross-docking<\u002Fh2>\n    <p class=\"lead\">Court ou long terme, nos installations sécurisées gardent vos marchandises exactement le temps qu'il faut, et le cross-docking (transbordement) garde le fret en mouvement quand l'entreposage n'est pas le but.<\u002Fp>\n    <ul class=\"checklist\">\n      <li>Installations sous vidéosurveillance 24 h/24, 7 j/7<\u002Fli>\n      <li>Marchandises entreposées sous clé<\u002Fli>\n      <li>Entreposage chauffé à température contrôlée : alimentaire, médical, industriel<\u002Fli>\n      <li>Zones réservées pour marchandises sensibles : l'emballage flexible ne partage jamais l'espace avec des matières incompatibles<\u002Fli>\n      <li>Entreposage en remorque dans des cours sécurisées : marchandises fragiles ou de grande valeur gardées en remorques de 53 pi jusqu'à la livraison, quand le cross-docking risquerait des dommages<\u002Fli>\n      <li>Installations à accès par badge, camions localisés, registre du personnel à chaque site<\u002Fli>\n      <li>EDI, WMS et inventaire en ligne : notre système ou le vôtre<\u002Fli>\n      <li>Chariots élévateurs électriques zéro émission seulement<\u002Fli>\n      <li>Court et long terme, sans engagement forcé<\u002Fli>\n      <li>Cross-docking et distribution groupée<\u002Fli>\n      <li>Distribution locale, nationale et transfrontalière<\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <!-- ======================= PROJETS ET SALONS ======================= -->\n  <section class=\"content-sec\" id=\"projects\">\n    <h2>Projets, salons et gestion dédiée<\u002Fh2>\n    <div class=\"svc-grid svc-grid-2\">\n      <div class=\"svc\"><span class=\"nm\">Services pour salons et foires<\u002Fspan>\n        <p>Coordination des livraisons, entreposage des caisses et retour après l’événement.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Gestion de projet<\u002Fspan>\n        <p>Un chargé de projet dédié planifie, obtient les permis et coordonne chaque phase.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <!-- « Pourquoi nous » rédigé à partir des notes des fondateurs, à valider. -->\n    <div class=\"pending\">Guichet unique, dirigé par les fondateurs, orienté solutions : apportez-nous le problème, nous revenons avec le plan. Heures inhabituelles, échéances récupérées, manutention spéciale : un service client qui s'adapte. <em>(Ébauche d'après les notes des fondateurs, à valider.)<\u002Fem><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ======================= CERTIFICATIONS =======================\n       Certifications tirées du contenu existant — confirmer qu'elles\n       sont toutes actives avant la mise en ligne. -->\n  <section class=\"why\" id=\"certifications\">\n    <h2>La conformité, c'est la base<\u002Fh2>\n    <div class=\"why-grid\">\n      <div class=\"why-item\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d98aa0\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:3px;\" aria-hidden=\"true\"><path d=\"M12 3 L4 6 V11 C4 16 7.5 19.5 12 21 C16.5 19.5 20 16 20 11 V6 Z\"><\u002Fpath><path d=\"M9 12 L11 14 L15 9.5\"><\u002Fpath><\u002Fsvg>\n        <div>\n          <span class=\"big\">CTPAT · PIP · FAST<\u002Fspan>\n          <p>Des agents certifiés qui gardent les passages Canada–É.-U. rapides et prévisibles.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why-item\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d98aa0\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:3px;\" aria-hidden=\"true\"><path d=\"M20 6 L9 17 L4 12\"><\u002Fpath><\u002Fsvg>\n        <div>\n          <span class=\"big\">Alimentaire et pharma<\u002Fspan>\n          <p>Équipements certifiés pour le fret alimentaire et pharmaceutique : la prévention de la contamination croisée, appliquée, pas promise.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why-item\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d98aa0\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:3px;\" aria-hidden=\"true\"><path d=\"M12 4 L22 20 H2 Z\"><\u002Fpath><path d=\"M12 10 V14\"><\u002Fpath><path d=\"M12 16.8 V17\"><\u002Fpath><\u002Fsvg>\n        <div>\n          <span class=\"big\">Accrédité HAZMAT<\u002Fspan>\n          <p>Les marchandises dangereuses, prises en charge par une équipe accréditée, de bout en bout.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why-item\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d98aa0\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:3px;\" aria-hidden=\"true\"><path d=\"M12 3 L4 6 V11 C4 16 7.5 19.5 12 21 C16.5 19.5 20 16 20 11 V6 Z\"><\u002Fpath><\u002Fsvg>\n        <div>\n          <span class=\"big\">Entièrement assuré<\u002Fspan>\n          <p>Certification complète et couverture d'assurance sur chaque expédition, pour une tranquillité d'esprit accrue.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ======================= SUIVI ======================= -->\n  <section class=\"content-sec\" id=\"track\">\n    <h2>Suivez une expédition<\u002Fh2>\n    <p class=\"lead\">Entrez votre numéro PRO pour voir où se trouve votre marchandise en ce moment, et téléchargez la preuve de livraison dès son arrivée.<\u002Fp>\n    <form class=\"tool-card\" style=\"max-width:430px; margin-top:24px;\" action=\"https://tracking.integratedfn.com/DMWeb\" method=\"get\" target=\"_blank\" rel=\"noopener\">\n      <input type=\"text\" name=\"pro\" placeholder=\"N° PRO\" aria-label=\"Numéro PRO\">\n      <button class=\"btn btn-primary\" type=\"submit\" style=\"margin-top:10px;\">Suivre l'expédition<\u002Fbutton>\n    <\u002Fform>\n  <\u002Fsection>\n\n  <!-- ======================= TÉMOIGNAGE ======================= -->\n  <section class=\"testi\">\n    <span class=\"tag\">Ce que disent nos clients<\u002Fspan>\n    <blockquote>« Dès le début de notre collaboration, nous leur avons simplement confié toutes les exigences de livraison particulières. »<\u002Fblockquote>\n    <p class=\"who\">Shawn Coveny, président, Federal Steel Equipment<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ======================= CTA FINAL ======================= -->\n  <section class=\"final\" id=\"quote\">\n    <h2>De la marchandise à faire bouger?<\u002Fh2>\n    <p>Obtenez une soumission personnalisée. Réponse en un jour ouvrable.<\u002Fp>\n    <a class=\"btn btn-primary\" href=\"fr-contact.html#quote\" data-cta=\"final\">Soumission de transport<\u002Fa>\n  <\u002Fsection>\n<\u002Fmain>\n\n<!-- ======================= FOOTER ======================= -->\n<footer id=\"contact-footer\">\n  <div class=\"foot-top\">\n    <div class=\"foot-col brand\">\n      <div class=\"h\">Retail Logistics Canada<\u002Fdiv>\n      <div>Une bannière, trois compagnies :<\u002Fdiv>\n      <div class=\"foot-logos\">\n        <!-- Navy logos sit on white chips in the dark footer; swap for\n             white/reversed versions if the client provides them. -->\n        <span class=\"logo-chip\"><img src=\"7b3925a8-dc44-4eae-b7cf-2792683d80be\" alt=\"Retail Logistics Canada\"><\u002Fspan>\n        <span class=\"logo-chip\"><img src=\"a71606ce-86e0-439f-bdc1-768000ae9c2d\" alt=\"Integrated Freight Networks\"><\u002Fspan>\n        <span class=\"logo-chip\"><img src=\"e4540607-8678-47eb-aad5-761dc282777f\" alt=\"Integrated Transportation Solutions\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot-col\">\n      <div class=\"h\">Services<\u002Fdiv>\n      <div><a href=\"fr-retail-logistics.html\">Distribution au détail et merchandising<\u002Fa><\u002Fdiv>\n      <div );\n  var nav = document.getElementById('main-nav');\n  if (btn && nav) {\n    btn.addEventListener('click', function () {\n      var open = nav.classList.toggle('open');\n      btn.setAttribute('aria-expanded', open ? 'true' : 'false');\n    });\n    nav.addEventListener('click', function (e) {\n      if (e.target.tagName === 'A') {\n        nav.classList.remove('open');\n        btn.setAttribute('aria-expanded', 'false');\n      }\n    });\n  }\n})();\n\n// Sticky rail: appears only after the page hero scrolls out of view,\n// and never overlaps the footer.\n(function () {\n  var rail = document.getElementById('tools-rail');\n  var hero = document.getElementById('top');\n  var footer = document.querySelector('footer');\n  if (!rail || !hero) return;\n\n  var pastHero = false;\n  var atFooter = false;\n\n  function update() {\n    rail.classList.toggle('is-visible', pastHero && !atFooter);\n  }\n\n  if ('IntersectionObserver' in window) {\n    new IntersectionObserver(function (entries) {\n      pastHero = !entries[0].isIntersecting;\n      update();\n    }, { rootMargin: '-80px 0px 0px 0px' }).observe(hero);\n\n    if (footer) {\n      new IntersectionObserver(function (entries) {\n        atFooter = entries[0].isIntersecting;\n        update();\n      }, { rootMargin: '0px 0px -40px 0px' }).observe(footer);\n    }\n  } else {\n    window.addEventListener('scroll', function () {\n      pastHero = window.scrollY > hero.offsetHeight;\n      update();\n    }, { passive: true });\n  }\n})();\n\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
