document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Retail Distribution &amp; Merchandising | Retail Logistics Canada<\u002Ftitle>\n<meta name=\"description\" content=\"Store-ready, coast-to-coast retail distribution: new store openings, renovations, relocations, reverse logistics and in-store merchandising. One team since 2003.\">\n<link rel=\"alternate\" hreflang=\"en-CA\" href=\"https://retaillogistics.ca/retail-logistics.html\">\n<link rel=\"alternate\" hreflang=\"fr-CA\" href=\"https://retaillogistics.ca/fr/retail-logistics.html\">\n<link rel=\"alternate\" hreflang=\"x-default\" href=\"https://retaillogistics.ca/retail-logistics.html\">\n<link rel=\"canonical\" href=\"https://retaillogistics.ca/retail-logistics.html\">\n<style>\n/* ============================================================\n   Retail Logistics Canada: shared design system\n   Extracted from the approved homepage mockup (index.html).\n   Accent #C8102E · Dark #1D2733 · Grey bg #F4F6F8\n   ============================================================ */\n:root {\n  --accent: #C8102E;\n  --dark: #1d2733;\n  --ink: #1d2733;\n  --muted: #444f5b;\n  --muted-2: #5d6873;\n  --grey-bg: #f4f6f8;\n  --line: #e3e7eb;\n  --tag: #8a94a0;\n}\n\n* { margin: 0; padding: 0; box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nbody {\n  font-family: Helvetica, Arial, sans-serif;\n  color: var(--ink);\n  font-size: 17px;\n  line-height: 1.5;\n  background: #fff;\n}\nimg { max-width: 100%; display: block; }\na { color: inherit; text-decoration: none; }\n.wrap { max-width: 1280px; margin: 0 auto; }\n\n/* ---- shared bits ---- */\n.btn {\n  display: inline-block;\n  padding: 16px 34px;\n  border-radius: 4px;\n  font-weight: bold;\n  font-size: 17px;\n  cursor: pointer;\n  border: none;\n}\n.btn-primary { background: var(--accent); color: #fff; }\n.btn-primary:hover { background: #a50d26; }\n.btn-ghost { border: 2px solid var(--dark); color: var(--dark); padding: 14px 32px; }\n.btn-ghost:hover { background: var(--dark); color: #fff; }\n\n.tag {\n  display: inline-block;\n  font-size: 12px;\n  letter-spacing: 1.2px;\n  text-transform: uppercase;\n  color: var(--tag);\n  font-weight: bold;\n}\n\n.ph {\n  background: #e6eaee;\n  border: 1px dashed #b3bcc6;\n  color: #7d8794;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 13px;\n  font-style: italic;\n  text-align: center;\n  padding: 10px;\n}\n\nh2 { font-size: 34px; line-height: 1.2; }\n.section-pad { padding: 65px 90px; }\n\n/* ---- header ---- */\nheader {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 26px 90px;\n  border-bottom: 1px solid var(--line);\n  position: sticky;\n  top: 0;\n  background: #fff;\n  z-index: 60;\n}\n.logo-box { width: 220px; height: 52px; }\n.logo-img { width: auto; height: 48px; max-width: 240px; object-fit: contain; display: block; }\nnav { display: flex; align-items: center; gap: 34px; font-size: 16px; font-weight: bold; }\nnav > a:hover, nav .has-sub > a:hover { color: var(--accent); }\nnav .cta { background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 4px; }\nnav .cta:hover { background: #a50d26; color: #fff; }\nnav .lang { color: var(--tag); font-weight: normal; }\n\n/* services dropdown */\nnav .has-sub { position: relative; }\nnav .sub {\n  display: none;\n  position: absolute;\n  top: 100%;\n  left: -18px;\n  background: #fff;\n  border: 1px solid var(--line);\n  border-radius: 0 0 6px 6px;\n  box-shadow: 0 8px 22px rgba(0,0,0,.10);\n  min-width: 300px;\n  padding: 10px 0;\n  z-index: 70;\n}\nnav .has-sub:hover .sub, nav .has-sub:focus-within .sub { display: block; }\nnav .sub a { display: block; padding: 10px 20px; font-size: 15px; font-weight: normal; }\nnav .sub a:hover { background: var(--grey-bg); color: var(--accent); }\nnav .sub .grp {\n  font-size: 10px; letter-spacing: 1px; text-transform: uppercase;\n  color: var(--tag); font-weight: bold; padding: 10px 20px 4px 20px;\n}\n\n.nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 8px; }\n.nav-toggle span { display: block; width: 26px; height: 3px; background: var(--dark); margin: 5px 0; border-radius: 2px; }\n\n/* ---- page hero (interior pages) ---- */\n.page-hero { display: flex; gap: 60px; padding: 65px 90px 55px 90px; align-items: center; }\n.page-hero .hero-text { flex: 1 1 580px; max-width: 620px; }\nh1 { font-size: 46px; line-height: 1.12; margin: 0 0 20px 0; }\n.hero-sub { font-size: 20px; color: var(--muted); margin-bottom: 30px; }\n.hero-ctas { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }\n.hero-proof { font-size: 15px; color: var(--muted-2); }\n.page-hero .hero-img { flex: 0 0 460px; width: 460px; height: 320px; object-fit: cover; border-radius: 6px; }\n\n/* home hero keeps larger H1 */\n.hero { display: flex; gap: 60px; padding: 75px 90px 65px 90px; align-items: center; }\n.hero .hero-text { flex: 1 1 580px; max-width: 580px; }\n.hero h1 { font-size: 52px; }\n.hero-img { flex: 0 0 460px; width: 460px; height: 340px; object-fit: cover; border-radius: 6px; }\n\n/* ---- badges ---- */\n.badge {\n  display: inline-block;\n  font-size: 13px;\n  font-weight: bold;\n  letter-spacing: 1px;\n  text-transform: uppercase;\n  padding: 6px 14px;\n  border-radius: 4px;\n  margin-bottom: 16px;\n}\n.badge-rlc { background: #FBEAF0; color: #72243E; }\n.badge-ifn { background: #E6F1FB; color: #0C447C; }\n.badge-its { background: #E1F5EE; color: #085041; }\n\n/* ---- division bands (home) ---- */\n.bands-intro { padding: 55px 90px 10px 90px; }\n.band { display: flex; gap: 70px; align-items: center; padding: 55px 90px; }\n.band.alt { background: var(--grey-bg); }\n.band-text { flex: 1 1 600px; max-width: 600px; }\n.band-img { flex: 0 0 430px; width: 430px; height: 230px; object-fit: cover; border-radius: 6px; }\n.band h3 { font-size: 30px; margin-bot : absolute; left: -10px; right: -10px; top: calc(100% + 4px);\n  z-index: 40; margin: 0; background: #fff;\n  border: none; border-radius: 10px;\n  padding: 14px 16px; font-size: 14px; line-height: 1.5; color: var(--muted);\n  box-shadow: 0 4px 10px rgba(29,39,51,.08), 0 18px 40px rgba(29,39,51,.16);\n}\n\n/* ---- softer remix: open cards, fewer boxes ---- */\n.svc { border: none; border-top: 1px solid #d8dde3; border-radius: 0; padding: 18px 8px 6px 0; }\n.svc:hover { border-color: var(--accent); }\n.svc-grid, .svc-row { gap: 10px 40px; }\n.badge, .svc .dvb { border-radius: 999px; }\n.hero-img, .band-img { border-radius: 10px; }\n.tool-card {\n  border: none; background: #f7f8fa; border-radius: 14px;\n  box-shadow: 0 1px 0 rgba(29,39,51,.04), 0 12px 28px rgba(29,39,51,.06);\n}\n.tool-card .tic { border-radius: 50%; border-width: 1.5px; }\n.tool-card input { background: #fff; }\n\n/* ---- why cards: match homepage treatment ---- */\n.why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 44px; }\n.why-item {\n  border: 1px solid #2e3845; border-radius: 10px; padding: 32px 34px;\n  display: flex; gap: 22px; align-items: flex-start;\n  transition: border-color .2s ease, background .2s ease;\n}\n.why-item:hover { border-color: var(--accent); background: #222c37; }\n.why-item .big { font-size: 22px; }\n.why-item p { line-height: 1.55; }\n@media (max-width: 900px) { .why-grid { grid-template-columns: 1fr; } }\n\n/* ---- division logos replace colored pills ---- */\n.div-logo { height: 44px; width: auto; display: block; margin-bottom: 18px; }\n#what-we-do .svc .nm { font-weight: normal; }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<!-- ======================= HEADER ======================= -->\n<header>\n  <a href=\"index.html\" aria-label=\"Retail Logistics Canada, home\">\n    <img class=\"logo-img\" src=\"8cfdf406-c99a-484e-9546-5f1c25233b82\" alt=\"Retail Logistics Canada\">\n  <\u002Fa>\n  <button class=\"nav-toggle\" aria-label=\"Open menu\" aria-expanded=\"false\" aria-controls=\"main-nav\">\n    <span><\u002Fspan><span><\u002Fspan><span><\u002Fspan>\n  <\u002Fbutton>\n  <nav id=\"main-nav\" aria-label=\"Main\">\n    <div class=\"has-sub\">\n      <a href=\"#top\" aria-haspopup=\"true\">Services ▾<\u002Fa>\n      <div class=\"sub\">\n      <a href=\"retail-logistics.html\">Retail Distribution &amp; Merchandising<\u002Fa>\n      <a href=\"freight.html\">Ground &amp; Cross-Border Freight<\u002Fa>\n      <a href=\"freight.html#specialized\">Specialized Freight: dry van, reefer, intermodal<\u002Fa>\n      <a href=\"freight.html#warehousing\">Warehousing &amp; Cross-Docking<\u002Fa>\n      <a href=\"supply-chain.html\">Supply Chain Consulting<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <a href=\"industries.html\">Industries<\u002Fa>\n    <a href=\"about.html\">About<\u002Fa>\n    <a href=\"contact.html\">Contact<\u002Fa>\n    <a class=\"cta\" href=\"contact.html#quote\">Get a Quote<\u002Fa>\n    <a class=\"lang\" href=\"fr-retail-logistics.html\" hreflang=\"fr\" lang=\"fr\">FR<\u002Fa>\n  <\u002Fnav>\n<\u002Fheader>\n\n<main>\n  <!-- ======================= PAGE HERO ======================= -->\n  <section class=\"page-hero\" id=\"top\">\n    <div class=\"hero-text\">\n      <img class=\"div-logo\" src=\"8cfdf406-c99a-484e-9546-5f1c25233b82\" alt=\"Retail Logistics Canada\">\n      <h1>Nobody knows retail distribution like we do<\u002Fh1>\n      <p class=\"hero-sub\">Store-ready, coast-to-coast handling and distribution for any type of retail product: delivery windows, dock scheduling and in-store execution handled by one team.<\u002Fp>\n      <div class=\"hero-ctas\">\n        <a class=\"btn btn-primary\" href=\"contact.html#quote\" data-cta=\"hero\">Get a quote<\u002Fa>\n      <\u002Fdiv>\n      <p class=\"hero-proof\">A proprietary network of local distributors in every region of Canada.<\u002Fp>\n    <\u002Fdiv>\n    <img class=\"hero-img\" src=\"23776cfe-a811-4909-9d20-92b66d628d14\" alt=\"Delivery driver wheeling boxes into a retail storefront\">\n  <\u002Fsection>\n\n  <!-- ======================= WHAT WE DO ======================= -->\n  <section class=\"content-sec\" id=\"what-we-do\">\n    <h2>What we do best<\u002Fh2>\n    <div class=\"svc-grid\">\n      <div class=\"svc\"><span class=\"nm\">New store openings<\u002Fspan>\n        <p>We consolidate materials from all your suppliers near your new store, then deliver on demand.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Renovations<\u002Fspan>\n        <p>Evening and early-morning crews hand-deliver, unpack the new and remove the old.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Relocations<\u002Fspan>\n        <p>Store moves with temporary storage, or same-day transfers to the new location.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Multi-store rollouts &amp; seasonal programs<\u002Fspan>\n        <p>Timed deliveries so national rollouts and resets land together, on the same standard and the same day.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Re-branding &amp; product testing<\u002Fspan>\n        <p>We dismantle and remove the old, restock the new and consolidate returns.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Merchandising &amp; in-store execution<\u002Fspan>\n        <p>Turnkey merchandising across Canadian big-box retail: staffing, planograms, resets and reporting.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Endcap, POP displays &amp; special orders<\u002Fspan>\n        <p>Displays and one-off orders delivered and set up on retail’s schedule.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Pick &amp; pack and e-commerce fulfillment<\u002Fspan>\n        <p>SKU-level receiving, prep and B2B/B2C fulfillment with EDI and online inventory visibility.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">National big-box deliveries &amp; roadshows<\u002Fspan>\n        <p>Daily deliveries to the country’s largest retailers: appointments, pallet specs and PO criteria handled.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">White glove &amp; final mile<\u002Fspan>\n        <p>Our own national white glove network: uncrating, setup, debris removal, time-definite delivery.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ======================= RETAIL'S RULES ======================= -->\n  <section class=\"content-sec alt\" id=\"retail-rules\">\n    <h2>Built for retail's rules<\u002Fh2>\n    <p class=\"lead\">The final leg of the retail supply chain is the hardest one. We do the research going in, so we arrive with the right strategy and equipment, saving you time and money.<\u002Fp>\n    <ul class=\"checklist\">\n      <li>Deliveries coordinated with mall security<\u002Fli>\n      <li>Strict delivery windows respected<\u002Fli>\n      <li>Dock facilities reserved when available<\u002Fli>\n      <li>Loading and handling restrictions understood in advance<\u002Fli>\n      <li>Tailgate delivery where there's no truck-level dock<\u002Fli>\n      <li>Hand delivery by dolly where pallet jacks are prohibited<\u002Fli>\n      <li>After-hours work for special projects<\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <!-- ======================= WHO WE SERVE ======================= -->\n  <section class=\"content-sec\" id=\"who-we-serve\">\n    <h2>Who we serve<\u002Fh2>\n    <div class=\"svc-grid\">\n      <div class=\"svc\"><span class=\"nm\">Retail banners &amp; chains<\u002Fspan>\n        <p>Rollouts, expansions and seasonal programs that land together across the country.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Retail industry suppliers<\u002Fspan>\n        <p>Flooring, fixtures, displays and millwork ride our distribution network into stores.<\u002Fp><\u002Fdiv>\n      <div class=\"svc\"><span class=\"nm\">Foreign-based retailers<\u002Fspan>\n        <p>We consolidate, clear customs, store and deliver to each store, from anywhere.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ======================= WHY CHOOSE US =======================\n       Drafted from the founders' meeting notes (founder-led, customer\n       service, solutions-oriented, one-stop shop), owners to validate. -->\n  <section class=\"why\" id=\"why-us\">\n    <h2>Led by people who get it<\u002Fh2>\n    <div class=\"why-grid\">\n      <div class=\"why-item\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d98aa0\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:3px;\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 20 C4 16 8 14.5 12 14.5 C16 14.5 20 16 20 20\"><\u002Fpath><\u002Fsvg>\n        <div>\n          <span class=\"big\">Founder-led<\u002Fspan>\n          <p>The people who built the company since 2003 are still the ones standing behind every delivery.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why-item\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d98aa0\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:3px;\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7 V12 L15.5 14\"><\u002Fpath><\u002Fsvg>\n        <div>\n          <span class=\"big\">We accommodate, period<\u002Fspan>\n          <p>Odd hours, special orders, last-minute changes: customer service means adapting to your reality, not ours.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why-item\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d98aa0\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:3px;\" aria-hidden=\"true\"><path d=\"M20 6 L9 17 L4 12\"><\u002Fpath><\u002Fsvg>\n        <div>\n          <span class=\"big\">Solutions-oriented<\u002Fspan>\n          <p>Bring us the problem. We come back with the plan, and then we execute it.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why-item\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d98aa0\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:3px;\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"><\u002Frect><\u002Fsvg>\n        <div>\n          <span class=\"big\">One-stop shop<\u002Fspan>\n          <p>Distribution, storage, merchandising and installation under one banner, with one contact from quote to set-up.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ======================= TESTIMONIAL ======================= -->\n  <section class=\"testi\">\n    <blockquote>“Their commitment to excellent service, and working closely with us as a customer, has been instrumental in the successful launch and ongoing expansion of our newest division.”<\u002Fblockquote>\n    <p class=\"who\">Keith Burrows, Senior Vice-President Distribution Logistics, La Senza<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ======================= FINAL CTA ======================= -->\n  <section class=\"final\" id=\"quote\">\n    <h2>Planning a rollout, reno or opening?<\u002Fh2>\n    <p>Tell us about the project. We respond within one business day.<\u002Fp>\n    <a class=\"btn btn-primary\" href=\"contact.html#quote\" data-cta=\"final\">Get a quote<\u002Fa>\n  <\u002Fsection>\n<\u002Fmain>\n\n<!-- ======================= FOOTER ======================= -->\n<footer id=\"contact-footer\">\n  <div class=\"foot-top\">\n    <div class=\"foot-col brand\">\n r = entries[0].isIntersecting;\n        update();\n      }, { rootMargin: '0px 0px -40px 0px' }).observe(footer);\n    }\n  } else {\n    window.addEventListener('scroll', function () {\n      pastHero = window.scrollY > hero.offsetHeight;\n      update();\n    }, { passive: true });\n  }\n})();\n\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
